---
# role: podman
# file: .github/workflows/dev.yml

name: dev push smoke

on:
  push:
    branches:
      - dev
    paths-ignore:
      - .gitignore
      - .pre-commit-config.yaml
      - LICENSE
      - README.md
      - docs/**

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  molecule-smoke:
    env:
      TERM: xterm-256color
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "true"
    name: Molecule smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --only-group ansible --only-group podman

      - name: Cache Ansible Collections
        if: hashFiles('collections.yml') != ''
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('collections.yml') }}

      - name: Install required Ansible Collections
        run: |
          set -euo pipefail
          if [ -f collections.yml ]; then
            uv run ansible-galaxy collection install -r collections.yml
          fi

      - name: Run ansible-lint
        run: uv run ansible-lint --force-color --offline --profile production .

      - name: Show Podman environment
        run: |
          set -euo pipefail
          podman --version
          podman info

      - name: Run Molecule smoke scenario
        run: |
          set -euo pipefail
          uv run molecule test -s "default"
