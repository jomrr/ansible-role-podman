---
# role: podman
# file: molecule/resources/playbooks/prepare.yml

- name: PODMAN | Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: PODMAN | Restore mapping helper capabilities stripped from the Fedora image
      become: true
      become_user: root
      community.general.capabilities:
        path: "/usr/bin/{{ __podman_helper.name }}"
        capability: "{{ __podman_helper.capability }}"
        state: present
      loop:
        - name: newuidmap
          capability: cap_setuid+ep
        - name: newgidmap
          capability: cap_setgid+ep
      loop_control:
        loop_var: __podman_helper
        label: "{{ __podman_helper.name }}"
      when: ansible_facts.distribution == 'Fedora'

    - name: PODMAN | Create service account below UID 1000
      become: true
      become_user: root
      ansible.builtin.user:
        name: podman_service
        uid: 901
        system: true
        home: /var/lib/podman_service
        create_home: true

    - name: PODMAN | Prepare rootless runtime directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /run/podman-molecule-rootless
        state: directory
        owner: podman_service
        mode: '0700'

    - name: PODMAN | Seed existing subordinate assignments
      become: true
      become_user: root
      ansible.builtin.lineinfile:
        path: "{{ __podman_fixture.0 }}"
        line: "{{ __podman_fixture.1 }}"
        create: true
        owner: root
        group: root
        mode: '0644'
      loop: "{{ ['/etc/subuid', '/etc/subgid'] | product(['podman_unmanaged:30000:4096', 'podman_service:10000:4096']) }}"
      loop_control:
        loop_var: __podman_fixture
        label: "{{ __podman_fixture.0 }}: {{ __podman_fixture.1 }}"
