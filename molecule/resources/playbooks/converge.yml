---
# role: podman
# file: molecule/resources/playbooks/converge.yml

- name: PODMAN | Converge
  hosts: all
  gather_facts: true
  pre_tasks:
    - name: PODMAN | Resolve service account home for the storage test
      ansible.builtin.getent:
        database: passwd
        key: podman_service
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
