---
# role: podman
# file: tasks/users.yml

- name: PODMAN | Resolve account home and ownership
  ansible.builtin.getent:
    database: passwd
    key: "{{ __podman_user.key }}"

- name: PODMAN | Validate subordinate ID assignment
  ansible.builtin.assert:
    that:
      - __podman_user.value is match('^[1-9][0-9]*:[1-9][0-9]*$')
    quiet: true
    fail_msg: "Invalid subordinate ID assignment for {{ __podman_user.key }}; expected positive start:count."
  when: podman_manual_mapping

- name: PODMAN | Maintain selected subordinate ID assignments
  become: true
  become_user: root
  ansible.builtin.lineinfile:
    path: "{{ __podman_mapping_file }}"
    regexp: "^{{ __podman_user.key | regex_escape }}:"
    line: "{{ __podman_user.key }}:{{ __podman_user.value }}"
    create: true
    owner: root
    group: root
    mode: '0644'
    backup: true
  loop:
    - /etc/subuid
    - /etc/subgid
  loop_control:
    loop_var: __podman_mapping_file
    label: "{{ __podman_user.key }} ({{ __podman_mapping_file }})"
  when: podman_manual_mapping

- name: PODMAN | Create rootless configuration directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[__podman_user.key][4] }}/.config/containers"
    state: directory
    owner: "{{ ansible_facts.getent_passwd[__podman_user.key][1] }}"
    group: "{{ ansible_facts.getent_passwd[__podman_user.key][2] }}"
    mode: '0750'
  when:
    - podman_configure
    - ansible_facts.getent_passwd[__podman_user.key][1] | int != 0

- name: PODMAN | Write rootless engine configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: home/containers.conf.j2
    dest: "{{ ansible_facts.getent_passwd[__podman_user.key][4] }}/.config/containers/containers.conf"
    owner: "{{ ansible_facts.getent_passwd[__podman_user.key][1] }}"
    group: "{{ ansible_facts.getent_passwd[__podman_user.key][2] }}"
    mode: '0640'
    backup: true
    validate: "{{ __podman_validators['containers.conf'] }}"
  when:
    - podman_configure
    - ansible_facts.getent_passwd[__podman_user.key][1] | int != 0
