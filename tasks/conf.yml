---
# role: podman
# file: tasks/conf.yml

- name: PODMAN | Create system configuration directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __podman_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/containers
    - /etc/containers/storage.rootless.conf.d
    - /etc/containers/registries.conf.d
  loop_control:
    loop_var: __podman_directory
    label: "{{ __podman_directory }}"

- name: PODMAN | Write engine and storage configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: "etc/containers/{{ __podman_config }}.j2"
    dest: "/etc/containers/{{ __podman_config }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: "{{ __podman_validators[__podman_config] }}"
  loop:
    - containers.conf
    - storage.conf
  loop_control:
    loop_var: __podman_config
    label: "{{ __podman_config }}"

- name: PODMAN | Write rootless storage defaults for Podman 6
  become: true
  become_user: root
  ansible.builtin.template:
    src: etc/containers/storage.rootless.conf.j2
    dest: /etc/containers/storage.rootless.conf.d/00-ansible.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: "{{ __podman_validators['storage.conf'] }}"

- name: PODMAN | Write registry and alias configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: etc/containers/registries.conf.j2
    dest: "{{ __podman_registry_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  loop:
    - /etc/containers/registries.conf
    - /etc/containers/registries.conf.d/99-ansible.conf
  loop_control:
    loop_var: __podman_registry_file
    label: "{{ __podman_registry_file }}"
